version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: lecturemind-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - neo4j
      - qdrant
      - ollama
    volumes:
      # Persist downloaded models (reranker + embeddings, ~2.3 GB) and
      # imported knowledge packages across container recreation.
      - backend_models:/app/local_runtime/models
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: lecturemind-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  neo4j:
    image: neo4j:5.24-community
    container_name: lecturemind-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=none
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: lecturemind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.4.0
    container_name: lecturemind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama/models
    restart: unless-stopped

volumes:
  neo4j_data:
  qdrant_data:
  ollama_models:
  backend_models:
  backend_data:
