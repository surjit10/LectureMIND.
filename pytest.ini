[pytest]
# Archived dev tooling (0-not-required/) and gitignored scratch (00_temp/)
# are never part of the active test suite.
norecursedirs = 0-not-required 00_temp .venv node_modules .next
# Manual live-server scripts (they hit http://localhost:8000 and assert
# nothing) are smoke tools, not automated tests — never collect them.
addopts = --ignore=tests/test_flow.py --ignore=tests/test_debug.py --ignore=tests/test_backend.py --ignore=tests/test_set_active.py
