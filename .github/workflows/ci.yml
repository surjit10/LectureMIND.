name: LectureMind V2 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall schemas/ config.py local/ agent/ retrieval/ serving/ -q

      - name: Run unit tests
        run: pytest tests/ cloud/tests/ local/tests/ agent/tests/ retrieval/tests/ serving/tests/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t lecturemind-backend .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t lecturemind-frontend .

  retrieval-eval:
    name: Retrieval Evaluation
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ranx==0.3.20

      - name: Run retrieval evaluation
        run: |
          echo "Retrieval evaluation would run here with test dataset."
          echo "Skipped in CI — requires running Neo4j/Qdrant."

      - name: Check for regression
        run: |
          echo "Regression check would compare against baseline metrics."
          echo "Pipeline fails if MRR drops below baseline threshold."
